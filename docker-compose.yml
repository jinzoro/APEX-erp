version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex_dev_password
      POSTGRES_DB: apex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-dev-anon-key}
    depends_on:
      db:
        condition: service_healthy

  # For full Supabase (Auth, Storage, Realtime, Edge Functions) self-hosting,
  # use the official Supabase docker stack (https://github.com/supabase/supabase/tree/master/docker)
  # and point VITE_SUPABASE_URL at it. This compose provides the app + a plain
  # Postgres for the data layer and migration bootstrap.

volumes:
  pgdata:
