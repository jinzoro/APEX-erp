
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>APEX LICENSE FORGE v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-lg w-full bg-slate-900 border border-slate-800 p-12 rounded-[3rem] shadow-2xl relative">
        <header class="mb-12">
            <h1 class="text-3xl font-black tracking-tight mb-2">License Forge <span class="text-blue-500">v4</span></h1>
            <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em]">Multi-Serial Master Key Generator</p>
        </header>
        
        <div class="space-y-10">
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-600 mb-4">Target HWID</label>
                <input id="mid" type="text" placeholder="APX-882A-7721-FF09" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-6 py-5 mono text-sm focus:border-blue-600 outline-none transition-all">
            </div>

            <div class="grid grid-cols-2 gap-6">
               <button onclick="generate(1)" class="bg-slate-800 hover:bg-blue-600 py-5 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all">Generate Single Key</button>
               <button onclick="generate(10)" class="bg-blue-600 hover:bg-blue-700 py-5 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all shadow-xl shadow-blue-500/20">Forge 10 Keys</button>
            </div>
            
            <div id="resultBox" class="hidden animate-in fade-in slide-in-from-bottom-6">
                <label class="block text-[10px] font-black uppercase tracking-widest text-blue-500 mb-4">Active Production Licenses</label>
                <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 mono text-blue-400 text-xs space-y-3 overflow-y-auto max-h-64 shadow-inner" id="output"></div>
            </div>
        </div>
    </div>

    <script>
        function generate(count) {
            const mid = document.getElementById('mid').value.trim().toUpperCase();
            if (!mid || mid.split('-').length < 2) return alert("Enter valid HWID");
            
            const midPart = mid.split('-')[1];
            const output = document.getElementById('output');
            output.innerHTML = '';
            
            for (let i = 1; i <= count; i++) {
                const serial = i.toString().padStart(2, '0');
                const type = "UNL";
                const payload = type + serial + midPart;
                
                let checksum = 0;
                for (let j = 0; j < payload.length; j++) {
                    checksum += payload.charCodeAt(j);
                }
                const suffix = (checksum % 999).toString().padStart(3, '0');
                
                const key = `APEX-${type}-${serial}-${midPart}-${suffix}`;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2 border-b border-slate-900 last:border-0';
                div.innerHTML = `<span>${key}</span><span class="text-[8px] opacity-30">V4-OK</span>`;
                output.appendChild(div);
            }
            
            document.getElementById('resultBox').classList.remove('hidden');
        }
    </script>
</body>
</html>
